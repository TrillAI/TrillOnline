<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="TrillXP — Go back to experience the early-2000s PC & Internet era, or educate someone who missed 56K Dial-Up, AOL 9.8, Classic Slingo, Zero-Lag Solitaire, PowerShell 1.0 & Windows XP. Includes official signed Android TrillXP.apk!"
    />
    <title>TrillXP — Windows XP Time Machine &amp; 2000s PC Museum</title>
    <link rel="icon" type="image/svg+xml" href="/icons/trillxp.svg" />
    <link rel="alternate icon" type="image/png" href="/icons/windows.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
        background: #000000;
        overflow: hidden;
        overscroll-behavior: none;
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: auto;
        touch-action: manipulation;
        font-family: Tahoma, 'Trebuchet MS', Verdana, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
