name: Build & Verify TrillXP Android APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TrillXP
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js & Java 17
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & Sign Full Offline TrillXP.apk (ecj + dx + aapt2 + V1/V2 Signing)
        run: python3 scripts/build_trillxp_apk.py

      - name: Verify Binary AndroidManifest.xml, DEX Bytecode & APK Signature Scheme v2
        run: |
          pip install androguard pyaxmlparser apksigtool
          python3 -c "from androguard.core.apk import APK; from androguard.core.dex import DEX; a = APK('public/downloads/TrillXP.apk'); assert a.get_package() == 'ai.trill.trillxp' and a.is_valid_APK(); d = DEX(a.get_dex()); assert len(d.get_classes()) >= 2"
          python3 -m apksigtool verify public/downloads/TrillXP.apk

      - name: Upload TrillXP.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrillXP-Android-APK
          path: public/downloads/TrillXP.apk
