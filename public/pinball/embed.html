<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <title>3D Pinball for Windows - Space Cadet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, Verdana, sans-serif;
      color: #fff;
      user-select: none;
    }
    #loading-wrap {
      text-align: center;
      font-size: 12px;
      color: #cfe4ff;
    }
    #progress {
      margin-top: 8px;
      width: 200px;
      height: 14px;
    }
    canvas.emscripten {
      border: 0 none;
      background-color: #000;
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="loading-wrap">
    <div id="status">Loading 3D Pinball - Space Cadet...</div>
    <progress hidden id="progress" max="100" value="0"></progress>
  </div>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" style="display:none" tabindex="0"></canvas>
  <script>
    const statusElement = document.getElementById("status");
    const loadingWrap = document.getElementById("loading-wrap");
    const progressElement = document.getElementById("progress");
    const canvasEl = document.getElementById("canvas");

    window.addEventListener("click", () => canvasEl.focus());
    window.addEventListener("message", (ev) => {
      if (ev.data && ev.data.type === "pinball-key") {
        const { key, keyCode, code, action } = ev.data;
        const evt = new KeyboardEvent(action || "keydown", {
          key, code, keyCode, which: keyCode, bubbles: true, cancelable: true
        });
        window.dispatchEvent(evt);
        document.dispatchEvent(evt);
        canvasEl.dispatchEvent(evt);
      }
    });

    var Module = {
      preRun: [],
      postRun: [function() {
        setTimeout(() => canvasEl.focus(), 150);
      }],
      print: function() {},
      printErr: function(e) { console.error(e); },
      canvas: (function() {
        canvasEl.addEventListener("webglcontextlost", function(e) {
          e.preventDefault();
        }, false);
        return canvasEl;
      })(),
      setStatus: function(e) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: "" };
        if (e === Module.setStatus.last.text) return;
        var m = e.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return;
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = e;
        if (m) {
          e = m[1];
          progressElement.value = parseInt(m[2]) * 100;
          progressElement.max = parseInt(m[4]) * 100;
          progressElement.hidden = false;
        } else {
          progressElement.hidden = true;
          canvasEl.style.display = "block";
        }
        statusElement.textContent = e;
        if (e === "") {
          loadingWrap.style.display = "none";
          canvasEl.style.display = "block";
          canvasEl.focus();
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "");
      }
    };
    Module.setStatus("Loading 3D Pinball...");
  </script>
  <script async src="SpaceCadetPinball.js"></script>
</body>
</html>
