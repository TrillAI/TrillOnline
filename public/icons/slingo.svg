<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="medallionBg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="65%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="slingoText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Outer Gold Casino Medallion Ring with Marquee Studs -->
  <circle cx="32" cy="31" r="28" fill="url(#medallionBg)" stroke="url(#goldBevel)" stroke-width="4" filter="url(#drop)"/>
  <circle cx="32" cy="31" r="23.5" fill="none" stroke="#fde047" stroke-width="1" stroke-dasharray="2.5 3.5" opacity="0.85"/>

  <!-- Jester Collar Ruffles (Green & Gold) -->
  <polygon points="18,43 24,50 28,43 32,51 36,43 40,50 46,43" fill="#16a34a" stroke="#14532d" stroke-width="1.2"/>

  <!-- Iconic 3-Pointed Slingo Joker Hat (Left Red, Center Gold, Right Royal Blue) -->
  <!-- Left Prong -->
  <path d="M22,25 C14,17 7,17 8,25 C11,22 15,24 19,29 Z" fill="#dc2626" stroke="#450a0a" stroke-width="1.3"/>
  <!-- Right Prong -->
  <path d="M42,25 C50,17 57,17 56,25 C53,22 49,24 45,29 Z" fill="#1d4ed8" stroke="#1e1b4b" stroke-width="1.3"/>
  <!-- Center Prong -->
  <path d="M23,24 C24,11 30,6 32,6 C34,6 40,11 41,24 Z" fill="#eab308" stroke="#713f12" stroke-width="1.3"/>
  <!-- Hat Brim -->
  <path d="M18,26 Q32,21 46,26 L45,29 Q32,25 19,29 Z" fill="#7c2d12" stroke="#fde047" stroke-width="1"/>

  <!-- 3 Golden Jester Bells -->
  <circle cx="7.5" cy="25.5" r="3.2" fill="url(#goldBevel)" stroke="#713f12" stroke-width="0.9"/>
  <circle cx="56.5" cy="25.5" r="3.2" fill="url(#goldBevel)" stroke="#713f12" stroke-width="0.9"/>
  <circle cx="32" cy="5.5" r="3.4" fill="url(#goldBevel)" stroke="#713f12" stroke-width="0.9"/>

  <!-- Smiling Slingo Joker Face -->
  <ellipse cx="32" cy="34" rx="12" ry="11" fill="url(#skinGrad)" stroke="#7c2d12" stroke-width="1.3"/>
  <!-- Rosy Cheeks -->
  <circle cx="24" cy="36" r="2.6" fill="#fb7185" opacity="0.65"/>
  <circle cx="40" cy="36" r="2.6" fill="#fb7185" opacity="0.65"/>
  <!-- Expressive Arched Brows & Eyes -->
  <path d="M25,29 Q27.5,27 30,29" fill="none" stroke="#451a03" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M34,29 Q36.5,27 39,29" fill="none" stroke="#451a03" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="27.5" cy="32" rx="1.8" ry="2.3" fill="#1e293b"/>
  <circle cx="28" cy="31.2" r="0.7" fill="#fff"/>
  <ellipse cx="36.5" cy="32" rx="1.8" ry="2.3" fill="#1e293b"/>
  <circle cx="37" cy="31.2" r="0.7" fill="#fff"/>
  <!-- Cheerful Nose & Big Grin -->
  <ellipse cx="32" cy="34.8" rx="2.1" ry="1.6" fill="#f97316"/>
  <path d="M25.5,37.2 Q32,43.5 38.5,37.2 Q32,40.2 25.5,37.2 Z" fill="#ffffff" stroke="#7f1d1d" stroke-width="1.2"/>

  <!-- Classic Arched Royal-Blue & Gold SLINGO Banner -->
  <rect x="4" y="46.5" width="56" height="14" rx="4.5" fill="#1e3a8a" stroke="url(#goldBevel)" stroke-width="2.2" filter="url(#drop)"/>
  <text x="32" y="57.2" text-anchor="middle" font-family="'Arial Black', Impact, Tahoma, sans-serif" font-size="11.5" font-weight="900" letter-spacing="0.6" fill="url(#slingoText)" stroke="#450a0a" stroke-width="0.6">SLINGO</text>
</svg>
